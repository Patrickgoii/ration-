<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рацион</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f1f6ef;--card:#fff;--text:#1b2b1f;--mute:#6b7d6f;--line:#dbe6d8;--ok:#2e9b4f;--warn:#e0902b;--bad:#d64545;--p:#3b82c4;--f:#e0902b;--c:#8b5cf6}
@media (prefers-color-scheme:dark){:root{--bg:#121a14;--card:#1b261e;--text:#e8f1ea;--mute:#8da392;--line:#2b3a2f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px 12px calc(24px + env(safe-area-inset-bottom,0px))}
h2{margin:0 0 8px;font-size:16px}
.card{background:var(--card);border-radius:16px;padding:12px;margin-bottom:12px;border:1px solid var(--line)}
input,select{width:100%;padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:15px}
.params{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.params label{display:flex;flex-direction:column;font-size:11px;color:var(--mute);gap:3px}
.hero{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.hero b{font-size:40px;letter-spacing:-1px;line-height:1}
.hero span,.sub{color:var(--mute)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s,background .25s}
.sub{margin-top:6px;font-size:12px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.macros .bar{height:6px;margin-top:4px}
.macros small{font-size:12px;color:var(--mute)}
.macros b{font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.item{position:relative;border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;background:var(--bg);cursor:pointer}
.item:active{transform:scale(.96)}
.item em{display:block;font-size:26px;font-style:normal}
.item span{display:block;font-size:12px;margin-top:2px}
.item small{color:var(--mute);font-size:11px}
.del{position:absolute;top:0;right:4px;color:var(--mute);font-size:18px;padding:2px 4px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row em{font-size:24px;font-style:normal}
.row div{flex:1;cursor:pointer}
.row small{color:var(--mute)}
.x{border:0;background:none;color:var(--mute);font-size:22px;padding:4px 8px}
.empty{color:var(--mute);padding:6px 0}
.add{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.add input:first-child{grid-column:1/-1}
.add button,.btn{border:0;border-radius:10px;background:var(--ok);color:#fff;font:inherit;padding:10px;cursor:pointer}
.add button{grid-column:1/-1}
.ghost{background:none;color:var(--mute);width:100%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
.modal[hidden]{display:none}
.sheet{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet b{display:block;margin-bottom:4px}
.sheet p{margin:0 0 10px;color:var(--mute);font-size:13px}
.sheet .mb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
</style>
</head>
<body>

<div class="card"><div class="params">
  <label>Пол<select id="sex"><option value="m">М</option><option value="f">Ж</option></select></label>
  <label>Возраст<input id="age" type="number" inputmode="numeric"></label>
  <label>Рост, см<input id="h" type="number" inputmode="numeric"></label>
  <label>Вес, кг<input id="w" type="number" inputmode="decimal"></label>
  <label>Дефицит<input id="def" type="number" inputmode="numeric"></label>
</div></div>

<div class="card">
  <div class="hero"><b id="left">0</b><span>ккал осталось</span></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="sub" id="sub"></div>
  <div class="macros" id="macros"></div>
</div>

<div class="card"><h2>Рацион</h2><div id="ration"></div></div>

<div class="card">
  <h2>Продукты</h2>
  <input id="q" placeholder="Поиск продукта">
  <div class="grid" id="products"></div>
  <h2 style="margin-top:16px">Свой продукт (на 100 г)</h2>
  <div class="add">
    <input id="n" placeholder="Название">
    <input id="k" type="number" inputmode="decimal" placeholder="ккал">
    <input id="pp" type="number" inputmode="decimal" placeholder="Б">
    <input id="ff" type="number" inputmode="decimal" placeholder="Ж">
    <input id="cc" type="number" inputmode="decimal" placeholder="У">
    <button id="addBtn">Добавить продукт</button>
  </div>
</div>

<button class="btn ghost" id="reset">Очистить рацион</button>

<div class="modal" id="m" hidden><div class="sheet">
  <b id="mt"></b><p id="mp"></p>
  <input id="mg" type="number" inputmode="numeric" placeholder="Граммы">
  <div class="mb"><button class="btn ghost" id="no">Отмена</button><button class="btn" id="ok">Готово</button></div>
</div></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r1 = x => Math.round(x * 10) / 10;

// e, name, ккал, Б, Ж, У (на 100 г), порция по умолчанию, г
const BASE = [
['🍗','Куриное филе',165,31,3.6,0,150],['🥩','Говядина',187,19,12,0,150],['🐟','Лосось',208,20,13,0,150],
['🥚','Яйцо',157,12.7,11.5,0.7,60],['🧀','Творог 5%',145,17,5,2,150],['🥛','Греч. йогурт',60,5,2,4,150],
['🥛','Молоко',52,2.9,2.5,4.7,200],['🧀','Сыр',350,25,27,0,30],['🍚','Рис варёный',130,2.7,0.3,28,150],
['🥣','Гречка варёная',110,4,1,21,150],['🥣','Овсянка варёная',88,3,1.7,15,200],['🍝','Макароны варёные',131,5,1.1,25,150],
['🥔','Картофель варёный',82,2,0.4,17,200],['🍞','Хлеб',250,8,3,49,30],['🍌','Банан',90,1.5,0.1,21,120],
['🍎','Яблоко',52,0.3,0.2,14,150],['🥒','Огурцы',15,0.8,0.1,2.8,100],['🍅','Помидоры',20,0.9,0.2,3.7,100],
['🧈','Масло подсолн.',899,0,99.9,0,10],['🥔','Чипсы',536,6,33,53,30]
].map(a => ({e:a[0],n:a[1],k:a[2],p:a[3],f:a[4],c:a[5],g:a[6]}));

let S;
try { S = JSON.parse(localStorage.getItem('ration-v2')); } catch (e) {}
S = S || {sex:'m', age:25, h:175, w:75, def:500, custom:[], ration:[]};
const save = () => { try { localStorage.setItem('ration-v2', JSON.stringify(S)); } catch (e) {} };
const all = () => BASE.concat(S.custom);

function target(){
  const bmr = 10*S.w + 6.25*S.h - 5*S.age + (S.sex === 'm' ? 5 : -161);
  return Math.max(1200, Math.round(bmr*1.4 - S.def));
}
const calc = x => ({k:x.k*x.g/100, p:x.p*x.g/100, f:x.f*x.g/100, c:x.c*x.g/100});

function render(){
  const t = target(), tot = {k:0,p:0,f:0,c:0};
  S.ration.forEach(x => { const v = calc(x); for (const q in tot) tot[q] += v[q]; });
  const left = Math.round(t - tot.k), pct = Math.min(100, tot.k / t * 100);
  $('left').textContent = left;
  $('left').style.color = left < 0 ? 'var(--bad)' : '';
  $('fill').style.width = pct + '%';
  $('fill').style.background = pct < 70 ? 'var(--ok)' : pct <= 100 ? 'var(--warn)' : 'var(--bad)';
  $('sub').textContent = 'Цель на день: ' + t + ' ккал · съедено ' + Math.round(tot.k);

  const tp = 2*S.w, tf = 0.9*S.w, tc = Math.max(0, (t - 4*tp - 9*tf) / 4);
  $('macros').innerHTML = [['Белки',tot.p,tp,'--p'],['Жиры',tot.f,tf,'--f'],['Углеводы',tot.c,tc,'--c']].map(m =>
    '<div><small>' + m[0] + '</small><br><b>' + Math.round(m[1]) + '</b><small> / ' + Math.round(m[2]) + ' г</small>' +
    '<div class="bar"><i style="width:' + Math.min(100, m[1]/(m[2]||1)*100) + '%;background:var(' + m[3] + ')"></i></div></div>').join('');

  const q = $('q').value.trim().toLowerCase(), list = all();
  $('products').innerHTML = list.map((p,i) => ({p,i})).filter(o => o.p.n.toLowerCase().includes(q)).map(o =>
    '<div class="item" data-i="' + o.i + '">' + (o.i >= BASE.length ? '<span class="del" data-d="' + (o.i - BASE.length) + '">×</span>' : '') +
    '<em>' + o.p.e + '</em><span>' + esc(o.p.n) + '</span><small>' + o.p.k + ' ккал/100 г</small></div>').join('')
    || '<div class="empty">Ничего не найдено</div>';

  $('ration').innerHTML = S.ration.length ? S.ration.map((x,i) => {
    const v = calc(x);
    return '<div class="row"><em>' + x.e + '</em><div data-e="' + i + '">' + esc(x.n) + ' · ' + x.g + ' г<br><small>' +
      Math.round(v.k) + ' ккал · Б ' + r1(v.p) + ' · Ж ' + r1(v.f) + ' · У ' + r1(v.c) + '</small></div>' +
      '<button class="x" data-r="' + i + '">×</button></div>';
  }).join('') : '<div class="empty">Нажми на продукт ниже, чтобы добавить его.</div>';
}

['sex','age','h','w','def'].forEach(id => {
  $(id).value = S[id];
  $(id).addEventListener('input', () => { S[id] = id === 'sex' ? $(id).value : (parseFloat($(id).value) || 0); save(); render(); });
});
$('q').addEventListener('input', render);

let ctx = null;
function ask(title, hint, g, fn){
  ctx = fn; $('mt').textContent = title; $('mp').textContent = hint; $('mg').value = g;
  $('m').hidden = false; setTimeout(() => $('mg').focus(), 50);
}
$('no').onclick = () => { $('m').hidden = true; };
$('ok').onclick = () => {
  const g = parseFloat($('mg').value);
  if (g > 0 && ctx) { ctx(g); save(); render(); }
  $('m').hidden = true;
};

$('products').addEventListener('click', e => {
  const d = e.target.closest('.del');
  if (d) { S.custom.splice(d.dataset.d, 1); save(); render(); return; }
  const it = e.target.closest('.item'); if (!it) return;
  const p = all()[it.dataset.i];
  ask(p.e + ' ' + p.n, 'Сколько грамм?', p.g, g => {
    S.ration.push(Object.assign({}, p, {g}));
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  });
});

$('ration').addEventListener('click', e => {
  const x = e.target.closest('.x');
  if (x) { S.ration.splice(x.dataset.r, 1); save(); render(); return; }
  const r = e.target.closest('[data-e]'); if (!r) return;
  const it = S.ration[r.dataset.e];
  ask(it.e + ' ' + it.n, 'Изменить граммы', it.g, g => { it.g = g; });
});

$('addBtn').onclick = () => {
  const n = $('n').value.trim(), k = parseFloat($('k').value);
  if (!n || !(k >= 0)) return;
  S.custom.push({e:'🍽️', n, k, p:parseFloat($('pp').value)||0, f:parseFloat($('ff').value)||0, c:parseFloat($('cc').value)||0, g:100});
  ['n','k','pp','ff','cc'].forEach(id => $(id).value = '');
  save(); render();
};

$('reset').onclick = () => { S.ration = []; save(); render(); };
render();
</script>
</body>
</html>
